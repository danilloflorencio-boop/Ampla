name: monitor-pacing · testes
on:
  push:
    paths: ['monitor-pacing/**']
  pull_request:
    paths: ['monitor-pacing/**']
jobs:
  testes:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitor-pacing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci || npm install
      - run: npm test
      - run: npm run build
