<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Monitor de pacing · Ampla</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&display=swap" rel="stylesheet">
  <style>/* Monitor de Pacing · Ampla
   Uma família (Archivo) variando largura: condensada nas tabelas, expandida nos títulos.
   Cor com significado: frio = abaixo do ritmo (verba parada), quente = acima (verba queimando). */

:root {
  color-scheme: light;
  --fundo: #eef1f4;
  --superficie: #ffffff;
  --superficie-2: #f6f8fa;
  --tinta: #17212c;
  --tinta-2: #4d5b6a;
  --tinta-3: #7b8896;
  --linha: #d6dde4;
  --linha-forte: #b7c2cd;
  --marca: #1d4e89;
  --foco: #2f6fd0;

  --ok: #2b7a52;
  --ok-fundo: #e4f2ea;
  --under-1: #4a74b4;
  --under-2: #1f3f98;
  --under-fundo: #e6edf8;
  --over-1: #cf7a1f;
  --over-2: #b8322b;
  --over-fundo: #fbebe3;
  --neutro: #8a96a3;
  --neutro-fundo: #edf0f3;
  --faixa: rgba(43, 122, 82, 0.16);

  --raio-1: 4px;
  --raio-2: 10px;
  --sombra: 0 1px 2px rgba(23, 33, 44, 0.06), 0 6px 24px rgba(23, 33, 44, 0.06);
  --fonte: 'Archivo', 'Segoe UI', system-ui, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif;

  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme='light']) {
    color-scheme: dark;
    --fundo: #10161d; --superficie: #18212b; --superficie-2: #1d2733; --tinta: #e5ebf1; --tinta-2: #a9b6c3;
    --tinta-3: #7f8d9b; --linha: #2a3644; --linha-forte: #3a4858; --marca: #8db6ec; --foco: #8db6ec;
    --ok: #5cc18c; --ok-fundo: #173327; --under-1: #7ea3dc; --under-2: #a9c3f0; --under-fundo: #1a2840;
    --over-1: #f0a24f; --over-2: #ff7b6e; --over-fundo: #3a2219; --neutro: #8b98a6; --neutro-fundo: #222d39;
    --faixa: rgba(92, 193, 140, 0.18); --sombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.25);
  }
}
:root[data-theme='dark'] {
  color-scheme: dark;
  --fundo: #10161d; --superficie: #18212b; --superficie-2: #1d2733; --tinta: #e5ebf1; --tinta-2: #a9b6c3;
  --tinta-3: #7f8d9b; --linha: #2a3644; --linha-forte: #3a4858; --marca: #8db6ec; --foco: #8db6ec;
  --ok: #5cc18c; --ok-fundo: #173327; --under-1: #7ea3dc; --under-2: #a9c3f0; --under-fundo: #1a2840;
  --over-1: #f0a24f; --over-2: #ff7b6e; --over-fundo: #3a2219; --neutro: #8b98a6; --neutro-fundo: #222d39;
  --faixa: rgba(92, 193, 140, 0.18); --sombra: 0 1px 2px rgba(0, 0, 0, 0.3), 0 6px 24px rgba(0, 0, 0, 0.25);
}

*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  margin: 0; background: var(--fundo); color: var(--tinta); font-family: var(--fonte);
  font-size: 15px; line-height: 1.45; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
}
body::before { content: ''; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--superficie); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
a { color: var(--marca); }
.oculto { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- topo ---------- */
.topo {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--superficie);
  border-bottom: 1px solid var(--linha);
}
.topo-linha { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 24px; max-width: 1480px; margin: 0 auto; }
.marca-app { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.marca-app h1 { font-size: 18px; font-weight: 700; font-stretch: 112%; letter-spacing: -0.01em; margin: 0; }
.marca-app span { color: var(--tinta-3); font-size: 13px; }
.campo { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--tinta-2); }
.campo select, .campo input {
  min-width: 0; padding: 6px 8px; border: 1px solid var(--linha-forte); border-radius: var(--raio-1);
  background: var(--superficie); font-size: 14px; color: var(--tinta);
}
.frescor { font-size: 12px; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; }
.frescor i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.frescor.velho i { background: var(--over-2); }
.acoes-topo { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: var(--raio-1);
  border: 1px solid var(--linha-forte); background: var(--superficie); cursor: pointer; font-size: 14px; white-space: nowrap;
}
.btn:hover { border-color: var(--tinta-3); }
.btn-primario { background: var(--marca); border-color: var(--marca); color: #fff; }
:root[data-theme='dark'] .btn-primario, .btn-primario { color: var(--superficie); }
.btn-primario:hover { filter: brightness(1.08); }
.btn-leve { border-color: transparent; background: transparent; color: var(--tinta-2); }
.btn-leve:hover { background: var(--superficie-2); border-color: transparent; }
.btn-mini { padding: 3px 8px; font-size: 13px; }

.filtros { display: flex; flex-wrap: wrap; gap: 10px 16px; padding: 0 24px 12px; max-width: 1480px; margin: 0 auto; align-items: flex-end; }
.abas { display: flex; gap: 2px; padding: 0 24px; max-width: 1480px; margin: 0 auto; overflow-x: auto; }
.abas button {
  border: 0; background: none; padding: 10px 14px; cursor: pointer; color: var(--tinta-2); font-size: 14px;
  border-bottom: 2px solid transparent; white-space: nowrap;
}
.abas button[aria-selected='true'] { color: var(--tinta); border-bottom-color: var(--marca); font-weight: 600; }
.abas .contador { margin-left: 6px; font-size: 12px; padding: 0 6px; border-radius: 9px; background: var(--neutro-fundo); color: var(--tinta-2); }
.abas .contador.quente { background: var(--over-fundo); color: var(--over-2); }

main { max-width: 1480px; margin: 0 auto; padding: 24px; }

/* ---------- fatos (painel da linha, plano e dados) ---------- */
.fatos { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 18px 28px; margin: 24px 0 0; padding: 20px 0 0; border-top: 1px solid var(--linha); }
.fatos div { min-width: 0; }
.fatos dt { font-size: 13px; color: var(--tinta-2); }
.fatos dd { margin: 2px 0 0; font-size: 20px; font-weight: 600; font-stretch: 94%; }
.fatos dd small { display: block; font-size: 13px; font-weight: 400; color: var(--tinta-2); font-stretch: 100%; }

/* ---------- régua de ritmo ---------- */
.regua { --consumo: 0%; --tempo: 0%; --tmin: 0%; --tmax: 0%; position: relative; height: 10px; min-width: 110px; }
.regua .trilho { position: absolute; inset: 0; border-radius: 5px; background: var(--neutro-fundo); overflow: visible; }
.regua .faixa { position: absolute; top: -3px; bottom: -3px; left: var(--tmin); width: calc(var(--tmax) - var(--tmin)); background: var(--faixa); border-radius: 3px; }
.regua .cheio { position: absolute; left: 0; top: 0; bottom: 0; width: min(var(--consumo), 100%); border-radius: 5px; background: var(--neutro); }
.regua .excesso { position: absolute; right: -6px; top: -2px; width: 4px; bottom: -2px; border-radius: 2px; background: var(--over-2); }
.regua .agora { position: absolute; top: -5px; bottom: -5px; left: var(--tempo); width: 2px; margin-left: -1px; background: var(--tinta); border-radius: 1px; }
.regua.grande { height: 22px; margin: 30px 0 34px; }
.regua.grande .trilho { border-radius: 11px; }
.regua.grande .cheio { border-radius: 11px; }
.regua.grande .faixa { top: -6px; bottom: -6px; }
.regua.grande .agora { top: -10px; bottom: -10px; width: 3px; }
.regua.grande .rotulo-agora, .regua.grande .rotulo-cheio { position: absolute; font-size: 13px; color: var(--tinta-2); white-space: nowrap; }
.regua.grande .rotulo-agora { left: clamp(80px, var(--tempo), calc(100% - 80px)); top: -32px; transform: translateX(-50%); }
.regua.grande .rotulo-cheio { left: clamp(50px, min(var(--consumo), 100%), calc(100% - 50px)); top: 30px; transform: translateX(-50%); color: var(--tinta); font-weight: 600; }

.s-ok .cheio, .chip.s-ok { --c: var(--ok); }
.s-atencao-under .cheio, .chip.s-atencao-under { --c: var(--under-1); }
.s-critico-under .cheio, .chip.s-critico-under, .s-sem-veiculacao .cheio, .chip.s-sem-veiculacao { --c: var(--under-2); }
.s-atencao-over .cheio, .chip.s-atencao-over { --c: var(--over-1); }
.s-critico-over .cheio, .chip.s-critico-over { --c: var(--over-2); }
.s-agendada .cheio, .chip.s-agendada, .s-sem-dados .cheio, .chip.s-sem-dados { --c: var(--neutro); }
.regua .cheio { background: var(--c, var(--neutro)); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--tinta); white-space: nowrap; }
.chip::before { content: ''; width: 9px; height: 9px; border-radius: 2px; background: var(--c, var(--neutro)); flex: none; }
.chip.s-critico-under::before, .chip.s-critico-over::before, .chip.s-sem-veiculacao::before { border-radius: 50%; width: 10px; height: 10px; }


/* ---------- blocos e grade ---------- */
.grade { display: grid; gap: 20px; margin-top: 20px; }
.grade-2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); }
.bloco { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-2); padding: 20px; min-width: 0; }
.bloco h2 { font-size: 16px; font-weight: 650; font-stretch: 108%; margin: 0 0 4px; }
.bloco .sub { margin: 0 0 14px; color: var(--tinta-2); font-size: 13px; }
.cabeca-bloco { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.grafico { position: relative; height: 280px; }
.grafico.baixo { height: 220px; }

/* ---------- tabelas ---------- */
.rolagem { overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio-2); background: var(--superficie); }
table.dados { width: 100%; border-collapse: collapse; font-stretch: 88%; font-size: 14px; }
table.dados th { text-align: left; font-weight: 600; color: var(--tinta-2); font-size: 12.5px; padding: 10px 10px; border-bottom: 1px solid var(--linha-forte); background: var(--superficie-2); position: sticky; top: 0; white-space: nowrap; }
table.dados td { padding: 9px 10px; border-bottom: 1px solid var(--linha); vertical-align: middle; white-space: nowrap; }
table.dados td.num, table.dados th.num { text-align: right; }
table.dados tr.grupo-2 td { font-weight: 600; }
table.dados tr.clicavel { cursor: pointer; }
table.dados tr.clicavel:hover td { background: var(--superficie-2); }
table.dados td.nome { white-space: normal; min-width: 240px; max-width: 420px; }
.recuo-1 { padding-left: 22px; }
.expansor { border: 0; background: none; cursor: pointer; width: 22px; color: var(--tinta-2); padding: 0; font-size: 12px; }
.mudo { color: var(--tinta-3); }
.forte { font-weight: 650; }
.dica { font-size: 12.5px; color: var(--tinta-2); }

/* ---------- navegação: painel geral × cliente ---------- */
.abas { align-items: center; }
.abas-sep { flex: none; width: 1px; height: 22px; background: var(--linha-forte); margin: 0 10px; }
.abas-cliente { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--tinta-2); margin-right: 4px; white-space: nowrap; }
.abas-cliente select { padding: 4px 6px; border: 1px solid var(--linha-forte); border-radius: var(--raio-1); background: var(--superficie); font-size: 13px; max-width: 200px; }

/* ---------- painel (quadro de contas) ----------
   Conceito de quadro de partidas / pregão: fundo escuro próprio, colunas fixas, rótulos em
   caixa alta espaçada, números tabulares e uma faixa que corre com os maiores desvios.
   Fica escuro nos dois temas, como um quadro físico. */
.quadro {
  --q-fundo: #0f1c2e; --q-fundo-2: #152640; --q-linha: rgba(160, 190, 230, 0.12); --q-tinta: #e8eef6; --q-tinta-2: #9fb2c8;
  --q-rotulo: #e9c46a; --q-ok: #6fd39d; --q-acima: #ffaa5e; --q-acima-forte: #ff7a6b; --q-abaixo: #8db8ff; --q-faixa: rgba(111, 211, 157, 0.16);
  background: linear-gradient(180deg, var(--q-fundo-2), var(--q-fundo) 220px); color: var(--q-tinta);
  border-radius: 14px; padding: 22px 22px 16px; box-shadow: 0 10px 40px rgba(8, 16, 28, 0.25); border: 1px solid #1d3352;
}
.quadro-cabeca { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.quadro-cabeca h2 { margin: 0; font-size: 22px; font-stretch: 115%; letter-spacing: -0.01em; }
.quadro-cabeca p { margin: 4px 0 0; color: var(--q-tinta-2); font-size: 13px; max-width: 80ch; }
.quadro-relogio { text-align: right; }
.quadro-relogio span { display: block; font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--q-rotulo); }
.quadro-relogio b { font-size: 22px; font-stretch: 90%; letter-spacing: 0.04em; }

.ticker { margin: 18px -22px 0; border-block: 1px solid var(--q-linha); background: rgba(0, 0, 0, 0.18); overflow: hidden; }
.ticker-trilho { display: inline-flex; white-space: nowrap; padding: 8px 0; }
.ticker-copia { display: inline-flex; }
.t-item { display: inline-flex; gap: 6px; align-items: baseline; padding: 0 22px; font-size: 13px; color: var(--q-tinta-2); border-right: 1px solid var(--q-linha); }
.t-item b { color: var(--q-tinta); font-weight: 600; }
.t-item i { font-style: normal; color: var(--q-tinta); font-weight: 600; }
.t-acima { color: var(--q-acima); } .t-abaixo { color: var(--q-abaixo); } .t-no-ritmo { color: var(--q-ok); }
@media (prefers-reduced-motion: no-preference) {
  .ticker-trilho { animation: correr 60s linear infinite; }
  .ticker:hover .ticker-trilho { animation-play-state: paused; }
  @keyframes correr { to { transform: translateX(-50%); } }
}
@media (prefers-reduced-motion: reduce) { .ticker { overflow-x: auto; } .ticker-copia { display: none; } }

.placar { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px; margin: 18px 0 0; background: var(--q-linha); border: 1px solid var(--q-linha); border-radius: 10px; overflow: hidden; }
.placar div { background: var(--q-fundo); padding: 12px 14px; min-width: 0; }
.placar dt { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--q-rotulo); }
.placar dd { margin: 4px 0 0; font-size: 26px; font-weight: 650; font-stretch: 90%; line-height: 1.1; }
.placar dd small { display: block; font-size: 12px; font-weight: 400; color: var(--q-tinta-2); font-stretch: 100%; margin-top: 2px; }
.placar .p-ok dd { color: var(--q-ok); } .placar .p-acima dd { color: var(--q-acima); } .placar .p-abaixo dd { color: var(--q-abaixo); }
.placar .p-aviso dd { color: var(--q-acima-forte); }
.placar .p-velho dd { color: var(--q-tinta-2); }

.quadro-filtros { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; margin: 18px 0 14px; }
.quadro-filtros .campo { color: var(--q-tinta-2); }
.quadro-filtros select { background: #0b1626; color: var(--q-tinta); border-color: #2a4466; }
.quadro .btn { background: transparent; color: var(--q-tinta); border-color: #2a4466; }
.quadro .btn:hover { border-color: var(--q-tinta-2); }

.quadro .rolagem { background: transparent; border-color: var(--q-linha); }
table.quadro-tabela { width: 100%; border-collapse: collapse; font-size: 14px; font-stretch: 90%; }
.quadro-tabela th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--q-rotulo); padding: 10px 8px; border-bottom: 1px solid #2a4466; background: #0b1626; position: sticky; top: 0; white-space: nowrap; }
.quadro-tabela td { padding: 10px 8px; border-bottom: 1px solid var(--q-linha); white-space: nowrap; vertical-align: middle; }
.quadro-tabela .num { text-align: right; }
.quadro-tabela tr.q-cliente td { background: rgba(255, 255, 255, 0.035); padding-top: 14px; font-weight: 600; border-bottom-color: #2a4466; }
.quadro-tabela tr.q-conta:hover td { background: rgba(141, 184, 255, 0.05); }
.quadro-tabela tr.q-conta td.q-nome { padding-left: 26px; }
.quadro-tabela tr.q-com-aviso td:first-child { box-shadow: inset 3px 0 0 var(--q-acima-forte); }
.q-nome-linha { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.q-nome { min-width: 250px; white-space: normal !important; }
.q-cliente-nome { font-size: 15px; font-weight: 650; }
.quadro .btn.q-botao { border-color: #3b5f8c; color: var(--q-tinta); background: rgba(141, 184, 255, 0.08); white-space: nowrap; }
.quadro .btn.q-botao:hover { background: rgba(141, 184, 255, 0.18); border-color: var(--q-abaixo); }
.q-plat { font-weight: 600; }
.q-sub { display: block; font-size: 12px; color: var(--q-tinta-2); font-weight: 400; }
.q-analista { color: var(--q-tinta-2); }
.q-indice { font-weight: 700; font-size: 15px; }
.q-osc { color: var(--q-tinta-2); font-size: 13px; }
.q-osc.sobe { color: var(--q-acima); } .q-osc.desce { color: var(--q-abaixo); }
.q-mudo { color: var(--q-tinta-2); }

.q-status { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12.5px; font-weight: 600; letter-spacing: 0.02em; }
.q-status b { font-size: 10px; }
.q-acima { color: var(--q-acima); background: rgba(255, 170, 94, 0.13); }
.q-abaixo { color: var(--q-abaixo); background: rgba(141, 184, 255, 0.13); }
.q-no-ritmo { color: var(--q-ok); background: rgba(111, 211, 157, 0.12); }
.q-neutro { color: var(--q-tinta-2); background: rgba(255, 255, 255, 0.06); }
.q-aviso { display: inline-flex; align-items: center; gap: 6px; margin-left: 8px; font-size: 12px; color: var(--q-acima-forte); }
.q-aviso::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px rgba(255, 122, 107, 0.18); }
@media (prefers-reduced-motion: no-preference) { .q-aviso::before { animation: piscar 2.4s ease-in-out infinite; } @keyframes piscar { 50% { box-shadow: 0 0 0 6px rgba(255, 122, 107, 0); } } }

/* barra de desvio: centro = plano; esquerda fria (abaixo), direita quente (acima); faixa = margem */
.desvio { --w: 0%; --m: 10%; position: relative; display: block; width: 110px; height: 12px; }
.desvio-faixa { position: absolute; top: 0; bottom: 0; left: calc(50% - var(--m)); width: calc(var(--m) * 2); background: var(--q-faixa); border-radius: 3px; }
.desvio-barra { position: absolute; top: 3px; bottom: 3px; width: var(--w); border-radius: 3px; }
.desvio.acima .desvio-barra { left: 50%; background: var(--q-acima); }
.desvio.abaixo .desvio-barra { right: 50%; background: var(--q-abaixo); }
.desvio-centro { position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--q-tinta); border-radius: 1px; }
.quadro-vazio { color: var(--q-tinta-2); padding: 24px 0; }
.quadro-nota { margin: 12px 0 0; font-size: 12.5px; color: var(--q-tinta-2); }

/* ---------- equipe e avisos ---------- */
.lista-simples { margin: 0 0 14px; padding-left: 18px; color: var(--tinta-2); font-size: 14px; }
.lista-simples li { margin-bottom: 4px; }
.campo-largo input { width: 100%; }
table.dados input, table.dados select { width: 100%; min-width: 160px; padding: 5px 7px; border: 1px solid var(--linha-forte); border-radius: var(--raio-1); background: var(--superficie); font-size: 14px; }
.chat-lista { display: flex; flex-direction: column; gap: 14px; margin-top: 8px; }
.chat { display: flex; gap: 12px; align-items: flex-start; }
.chat-avatar { flex: none; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--under-fundo); color: var(--marca); }
.chat-corpo { min-width: 0; flex: 1; }
.chat-meta { font-size: 13px; margin-bottom: 4px; }
.chat-app { font-size: 11px; padding: 0 5px; border-radius: 4px; background: var(--neutro-fundo); color: var(--tinta-2); }
.chat-balao { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--superficie-2); border: 1px solid var(--linha); border-radius: 4px 16px 16px 16px; padding: 12px 14px; font-size: 14px; line-height: 1.5; max-width: 90ch; margin-bottom: 6px; }

.marcar { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; }
table.dados .marcar input { width: auto; min-width: 0; }
.bloqueio h2 { display: flex; gap: 8px; align-items: center; }
.silencio { padding: 16px 18px; border-radius: var(--raio-2); background: var(--ok-fundo); color: var(--tinta); border-left: 4px solid var(--ok); }

/* ---------- visão geral (de um cliente) ---------- */
.vg { display: flex; flex-direction: column; gap: 18px; }
.vg-topo { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.vg-titulo { margin-right: auto; min-width: 0; }
.vg-titulo h2 { margin: 0; font-size: 24px; font-stretch: 110%; letter-spacing: -0.01em; }
.vg-titulo p { margin: 2px 0 0; color: var(--tinta-2); font-size: 13px; }
.vg-cartoes { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin: 0; }
.vg-cartoes div { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-2); padding: 16px 18px; min-width: 0; }
.vg-cartoes dt { font-size: 13px; color: var(--tinta-2); }
.vg-cartoes dd { margin: 4px 0 2px; font-size: 26px; font-weight: 650; font-stretch: 92%; }
.vg-cartoes small { font-size: 13px; color: var(--tinta-2); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.vg-ritmo { border-top: 4px solid var(--c, var(--neutro)) !important; }
.vg-ritmo.s-ok { --c: var(--ok); } .vg-ritmo.s-atencao-under { --c: var(--under-1); } .vg-ritmo.s-critico-under { --c: var(--under-2); }
.vg-ritmo.s-atencao-over { --c: var(--over-1); } .vg-ritmo.s-critico-over { --c: var(--over-2); }
.vg .regua.grande { margin: 34px 4px 30px; }
.vg-sub { display: block; font-size: 12px; color: var(--tinta-3); }
.vg-aviso { display: inline-block; margin-left: 8px; font-size: 12px; color: var(--over-2); }

/* ---------- página de teste ---------- */
.teste-intro { margin: 0 0 16px; max-width: 110ch; color: var(--tinta-2); }
table.dados td.ok { color: var(--ok); font-weight: 600; }
table.dados td.erro { color: var(--over-2); font-weight: 700; }
table.dados tr.falhou td { background: var(--over-fundo); }
.teste-roteiro table.dados td { white-space: normal; }

/* ---------- alertas ---------- */
.lista-alertas { display: flex; flex-direction: column; gap: 12px; }
.alerta { background: var(--superficie); border: 1px solid var(--linha); border-left: 4px solid var(--neutro); border-radius: var(--raio-1) var(--raio-2) var(--raio-2) var(--raio-1); padding: 16px 18px; }
.alerta.sev-critico { border-left-color: var(--over-2); }
.alerta.sev-atencao { border-left-color: var(--over-1); }
.alerta.sev-info { border-left-color: var(--under-1); }
.alerta.fechado { opacity: 0.62; }
.alerta h3 { margin: 0 0 6px; font-size: 15px; font-weight: 650; }
.alerta .meta { font-size: 12.5px; color: var(--tinta-3); margin-bottom: 8px; }
.alerta p { margin: 0 0 8px; max-width: 95ch; }
.alerta .acao { background: var(--superficie-2); border-radius: var(--raio-1); padding: 10px 12px; margin: 10px 0; max-width: 95ch; }
.alerta .acao strong { display: block; font-size: 12.5px; color: var(--tinta-2); font-weight: 600; margin-bottom: 2px; }
.alerta .complemento { font-size: 14px; color: var(--tinta-2); }
.alerta .botoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.alerta .decisao { font-size: 13px; color: var(--tinta-2); margin-top: 8px; }

.vazio { background: var(--superficie); border: 1px dashed var(--linha-forte); border-radius: var(--raio-2); padding: 40px 28px; text-align: left; }
.vazio h2 { margin: 0 0 8px; font-size: 22px; font-stretch: 110%; }
.vazio p { max-width: 62ch; color: var(--tinta-2); }
.vazio .botoes { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }

/* ---------- painel lateral (detalhe) ---------- */
.painel-fundo { position: fixed; inset: 0; background: rgba(10, 16, 22, 0.38); z-index: 20; }
.painel {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--fundo); z-index: 21;
  overflow-y: auto; padding: calc(env(safe-area-inset-top, 0px) + 20px) 24px calc(env(safe-area-inset-bottom, 0px) + 24px);
  border-left: 1px solid var(--linha); box-shadow: -10px 0 40px rgba(0, 0, 0, 0.15);
}
@media (prefers-reduced-motion: no-preference) { .painel { animation: entra 0.18s ease-out; } @keyframes entra { from { transform: translateX(24px); opacity: 0.6; } } }
.painel header { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 14px; }
.painel h2 { margin: 0; font-size: 19px; font-stretch: 108%; }
.painel textarea { width: 100%; min-height: 70px; padding: 8px 10px; border: 1px solid var(--linha-forte); border-radius: var(--raio-1); background: var(--superficie); resize: vertical; }
.painel .bloco { margin-top: 16px; }

dialog { border: 1px solid var(--linha); border-radius: var(--raio-2); background: var(--superficie); color: var(--tinta); padding: 22px; max-width: min(720px, 94vw); box-shadow: var(--sombra); }
dialog::backdrop { background: rgba(10, 16, 22, 0.45); }
dialog h2 { margin: 0 0 10px; font-size: 18px; }
dialog .botoes { display: flex; gap: 10px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.lista-check { max-height: 340px; overflow-y: auto; border: 1px solid var(--linha); border-radius: var(--raio-1); padding: 6px; }
.lista-check label { display: flex; gap: 8px; padding: 6px; align-items: flex-start; font-size: 14px; border-radius: var(--raio-1); }
.lista-check label:hover { background: var(--superficie-2); }

.aviso { padding: 10px 12px; border-radius: var(--raio-1); margin: 6px 0; font-size: 14px; background: var(--superficie-2); border-left: 3px solid var(--neutro); }
.aviso.critico { border-left-color: var(--over-2); }
.aviso.atencao { border-left-color: var(--over-1); }
.aviso.info { border-left-color: var(--under-1); }
.aviso code { font-size: 12px; color: var(--tinta-3); }

.toast { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); left: 50%; transform: translateX(-50%); background: var(--tinta); color: var(--superficie); padding: 10px 16px; border-radius: var(--raio-1); z-index: 40; font-size: 14px; max-width: 90vw; }


@media (max-width: 720px) {
  .topo { position: static; }
  .topo-linha { gap: 10px 14px; }
  .topo-linha, .filtros, .abas { padding-left: 14px; padding-right: 14px; }
  main { padding: 14px; }
  .marca-app { width: 100%; }
  .quadro { padding: 16px 14px 12px; border-radius: 10px; }
  .ticker { margin-inline: -14px; }
  .quadro-relogio { text-align: left; }
  .quadro-filtros .campo { flex: 1 1 140px; }
  .quadro-filtros select { width: 100%; }
  .abas-sep { display: none; }
}
@media print {
  .topo, .painel-fundo, .botoes, .acoes-topo, .ticker, .quadro-filtros { display: none !important; }
  body { background: #fff; }
}
